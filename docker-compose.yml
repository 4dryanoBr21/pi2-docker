version: '3.8'

services:
  app:
    build: .
    container_name: pi2_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pi2_net

  db:
    image: mariadb:10.4
    container_name: pi2_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - pi2_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pi2_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT:-8168}:80"   # phpMyAdmin (padrão: 8168)
    depends_on:
      - db
    networks:
      - pi2_net

  proxy:
    image: nginx:alpine
    container_name: pi2_proxy
    restart: unless-stopped
    environment:
      # true  -> HTTPS com certificado autoassinado (porta 443) + redirect de HTTP
      # false -> apenas HTTP, sem certificado (porta ${APP_PORT}, padrão 8192)
      USE_HTTPS: ${USE_HTTPS:-true}
    ports:
      - "${APP_PORT:-8192}:80"   # HTTP do app (padrão: 8192) -> porta 80 interna do proxy
      - "443:443"
    volumes:
      - ./nginx/conf-templates:/etc/nginx/conf-templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - app
    networks:
      - pi2_net

networks:
  pi2_net:
    driver: bridge

volumes:
  db_data: