services:
  app:
    build: .
    container_name: pi2_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pi2_net

  db:
    image: mariadb:10.4
    container_name: pi2_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projetomi
      MYSQL_USER: projetomi_user
      MYSQL_PASSWORD: projetomi_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - pi2_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pi2_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - pi2_net

networks:
  pi2_net:
    driver: bridge

volumes:
  db_data:
