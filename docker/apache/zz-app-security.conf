# Carregado por último (prefixo "zz-") para sobrescrever os padrões do Debian.

ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Security hardening headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=()"
Header always set Content-Security-Policy "default-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data:; font-src https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

# Sem listagem de diretórios (antes, /functions/, /img/ e /lang/ eram listáveis).
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Arquivos que existem só para serem incluídos pelo PHP (require) nunca
# devem ser abertos direto pelo navegador.
<FilesMatch "^(conexao|csrf|sessao|util|auth_criador|sala_helpers|idioma)\.php$">
    Require all denied
</FilesMatch>

<Directory /var/www/html/lang>
    Require all denied
</Directory>
