; Ajustes do ME INSCREVO (carregado depois do php.ini de produção).

expose_php = Off
date.timezone = UTC

; Cookie de sessão: inacessível ao JavaScript, não enviado em requisições
; cross-site e sem aceitar IDs de sessão inventados pelo cliente.
; (O flag "secure" é decidido em runtime por functions/sessao.php, porque
; depende de o acesso ser por HTTP ou HTTPS.)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; O sistema não usa o acompanhamento de progresso de upload da sessão.
; Desligado por segurança (reduz a superfície das falhas PHP2Shell; não
; substitui a atualização do PHP).
session.upload_progress.enabled = 0
