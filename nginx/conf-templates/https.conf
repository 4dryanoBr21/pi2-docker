include /etc/nginx/conf-templates/common.inc;

server {
    listen 80;
    server_name _;

    # Redireciona para HTTPS mantendo a requisição
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS fica DESLIGADO de propósito: com certificado autoassinado ele
    # impediria o navegador de permitir a exceção de segurança. Ative apenas
    # quando usar um certificado válido (ex.: Let's Encrypt):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf-templates/locations.inc;
}
